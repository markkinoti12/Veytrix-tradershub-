<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deriv Terminal</title>
<style>
:root{--bg:#0e1a24;--panel:#15252f;--line:#243847;--ink:#e6eef3;--dim:#8aa0ae;--up:#38d39f;--down:#ff6b6b;--amber:#f2b84b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 auto 0 0;font-weight:700;letter-spacing:.3px}
main{display:grid;gap:12px;padding:12px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));max-width:1200px;margin:auto}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
section.wide{grid-column:1/-1}
h2{font-size:14px;margin:0 0 10px;color:var(--dim);font-weight:600}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px}
input,select,button{font:inherit;color:var(--ink);background:#0b141c;border:1px solid var(--line);border-radius:6px;padding:8px;width:100%}
button{cursor:pointer;font-weight:600;background:#1c3342}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber)}
button.up{background:var(--up);color:#06231a;border:0}
button.down{background:var(--down);color:#2a0808;border:0}
button.go{background:var(--amber);color:#2b1d00;border:0}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px}.row>*{flex:1}
.stat{display:flex;gap:14px;flex-wrap:wrap}.stat b{display:block;font-size:18px}
#price{font-size:26px;font-weight:700}
canvas{width:100%;height:170px;display:block;background:#0b141c;border-radius:6px}
#digits{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
#digits span{width:22px;height:22px;display:grid;place-items:center;border-radius:4px;background:#0b141c;font-size:12px}
#digits span.e{color:var(--up)}#digits span.o{color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line)}
.w{color:var(--up)}.l{color:var(--down)}
.log{max-height:230px;overflow:auto}
.warn{font-size:12px;color:var(--amber);margin-top:8px}
#status{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>Deriv Terminal</h1>
  <span id="status">Disconnected</span>
  <div class="stat"><div>Balance<b id="bal">-</b></div><div>Session P/L<b id="pl">0.00</b></div></div>
</header>
<main>
<section>
  <h2>Connect</h2>
  <label>App ID (register yours at api.deriv.com)</label>
  <input id="appid" value="1089">
  <label>API token (Trade scope; use a Demo account token first)</label>
  <input id="token" type="password" placeholder="Paste token" autocomplete="off">
  <div class="row" style="margin-top:10px"><button class="go" id="connect">Connect</button><button id="disc" disabled>Disconnect</button></div>
  <div class="warn">Trading is risky and you can lose your whole stake. Test on a demo account. The token stays in this browser tab only.</div>
</section>

<section>
  <h2>Market</h2>
  <select id="sym">
    <option value="R_10">Volatility 10 Index</option>
    <option value="R_25">Volatility 25 Index</option>
    <option value="R_50">Volatility 50 Index</option>
    <option value="R_75">Volatility 75 Index</option>
    <option value="R_100" selected>Volatility 100 Index</option>
    <option value="1HZ10V">Volatility 10 (1s) Index</option>
    <option value="1HZ25V">Volatility 25 (1s) Index</option>
    <option value="1HZ50V">Volatility 50 (1s) Index</option>
    <option value="1HZ75V">Volatility 75 (1s) Index</option>
    <option value="1HZ100V">Volatility 100 (1s) Index</option>
  </select>
  <div id="price" style="margin-top:8px">-</div>
  <canvas id="chart" width="600" height="170"></canvas>
  <div id="digits" aria-label="Last digits"></div>
</section>

<section>
  <h2>Manual trade</h2>
  <label>Contract</label>
  <select id="ctype">
    <option value="CALL|PUT">Rise / Fall</option>
    <option value="DIGITEVEN|DIGITODD">Even / Odd</option>
    <option value="DIGITOVER|DIGITUNDER">Over / Under (barrier)</option>
    <option value="DIGITMATCH|DIGITDIFF">Matches / Differs (barrier)</option>
  </select>
  <div class="row">
    <div><label>Stake</label><input id="stake" type="number" value="1" min="0.35" step="0.01"></div>
    <div><label>Ticks</label><input id="dur" type="number" value="5" min="1" max="10"></div>
    <div><label>Barrier digit</label><input id="barrier" type="number" value="4" min="0" max="9"></div>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="up" id="buyA" disabled>Rise</button>
    <button class="down" id="buyB" disabled>Fall</button>
  </div>
</section>

<section>
  <h2>Auto bot</h2>
  <label>Strategy</label>
  <select id="strat">
    <option value="streak">Digit streak reversal (Even/Odd)</option>
    <option value="momentum">Momentum (Rise/Fall, follow N ticks)</option>
    <option value="revert">Mean reversion (Rise/Fall, fade N ticks)</option>
  </select>
  <div class="row">
    <div><label>Signal length (N)</label><input id="n" type="number" value="4" min="2" max="12"></div>
    <div><label>Base stake</label><input id="bstake" type="number" value="1" min="0.35" step="0.01"></div>
    <div><label>Ticks</label><input id="bdur" type="number" value="5" min="1" max="10"></div>
  </div>
  <div class="row">
    <div><label>Martingale x (1 = off)</label><input id="mart" type="number" value="1" min="1" step="0.1"></div>
    <div><label>Max stake</label><input id="maxs" type="number" value="10"></div>
  </div>
  <div class="row">
    <div><label>Take profit</label><input id="tp" type="number" value="5"></div>
    <div><label>Stop loss</label><input id="sl" type="number" value="5"></div>
    <div><label>Max trades</label><input id="mt" type="number" value="50"></div>
  </div>
  <div class="row" style="margin-top:12px"><button class="go" id="start" disabled>Start bot</button><button id="stop" disabled>Stop bot</button></div>
  <div id="botmsg" class="warn"></div>
</section>

<section class="wide">
  <h2>Trade log</h2>
  <div class="log"><table><thead><tr><th>Time</th><th>Source</th><th>Type</th><th>Stake</th><th>Result</th></tr></thead><tbody id="log"></tbody></table></div>
</section>
</main>

<script>
(function(){
const $=id=>document.getElementById(id);
let ws=null,authed=false,currency='USD',tickSub=null;
let ticks=[],digits=[];
let pl=0,botOn=false,openContract=false,curStake=0,trades=0;

const fmt=n=>Number(n).toFixed(2);
const send=o=>{ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); };
const status=t=>$('status').textContent=t;
const sym=()=>$('sym').value;

function setConnected(on){
  $('connect').disabled=on; $('disc').disabled=!on;
  ['buyA','buyB','start'].forEach(i=>$(i).disabled=!on);
  if(!on){$('stop').disabled=true;}
}

function connect(){
  const app=$('appid').value.trim()||'1089', tok=$('token').value.trim();
  if(!tok){status('Paste an API token first');return;}
  status('Connecting...');
  ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id='+encodeURIComponent(app));
  ws.onopen=()=>send({authorize:tok});
  ws.onmessage=e=>handle(JSON.parse(e.data));
  ws.onerror=()=>status('Connection error. Check App ID and network.');
  ws.onclose=()=>{authed=false;setConnected(false);stopBot('Disconnected');status('Disconnected');};
}

function handle(m){
  if(m.error){
    status('Error: '+m.error.message);
    if(m.msg_type==='buy'||m.msg_type==='proposal_open_contract'){openContract=false;}
    return;
  }
  switch(m.msg_type){
    case 'authorize':
      authed=true;currency=m.authorize.currency;
      status('Connected: '+m.authorize.loginid+(m.authorize.is_virtual?' (Demo)':' (REAL)'));
      setConnected(true);
      send({balance:1,subscribe:1});
      subscribeTicks();
      break;
    case 'balance': $('bal').textContent=fmt(m.balance.balance)+' '+m.balance.currency; break;
    case 'tick': onTick(m.tick); break;
    case 'history':
      ticks=m.history.prices.map(Number);
      digits=ticks.map(lastDigit); draw(); drawDigits(); break;
    case 'buy':
      send({proposal_open_contract:1,contract_id:m.buy.contract_id,subscribe:1,passthrough:m.echo_req.passthrough});
      break;
    case 'proposal_open_contract': onContract(m); break;
  }
}

function subscribeTicks(){
  if(tickSub) send({forget:tickSub});
  ticks=[];digits=[];
  send({ticks_history:sym(),count:100,end:'latest',style:'ticks',subscribe:1});
}

function lastDigit(p){
  const s=Number(p).toFixed(decimals);
  return +s[s.length-1];
}
let decimals=2;
function onTick(t){
  if(t.symbol!==sym())return;
  tickSub=t.id;
  decimals=t.pip_size||2;
  const p=Number(t.quote);
  ticks.push(p);digits.push(lastDigit(p));
  if(ticks.length>100){ticks.shift();digits.shift();}
  $('price').textContent=p.toFixed(decimals);
  draw();drawDigits();
  if(botOn&&!openContract) botDecide();
}

function draw(){
  const c=$('chart'),g=c.getContext('2d'),w=c.width,h=c.height;
  g.clearRect(0,0,w,h);
  if(ticks.length<2)return;
  const mn=Math.min(...ticks),mx=Math.max(...ticks),r=(mx-mn)||1;
  g.strokeStyle='#38d39f';g.lineWidth=2;g.beginPath();
  ticks.forEach((p,i)=>{
    const x=i/(ticks.length-1)*w,y=h-8-((p-mn)/r)*(h-16);
    i?g.lineTo(x,y):g.moveTo(x,y);
  });
  g.stroke();
}
function drawDigits(){
  $('digits').innerHTML=digits.slice(-24).map(d=>'<span class="'+(d%2?'o':'e')+'">'+d+'</span>').join('');
}

/* ---------- trading ---------- */
function labels(){
  const [a,b]=$('ctype').value.split('|');
  const map={CALL:'Rise',PUT:'Fall',DIGITEVEN:'Even',DIGITODD:'Odd',DIGITOVER:'Over',DIGITUNDER:'Under',DIGITMATCH:'Matches',DIGITDIFF:'Differs'};
  return [a,b,map[a],map[b]];
}
function refreshButtons(){const l=labels();$('buyA').textContent=l[2];$('buyB').textContent=l[3];}
$('ctype').onchange=refreshButtons;refreshButtons();

function buy(type,stake,dur,src){
  const params={amount:+stake,basis:'stake',contract_type:type,currency,duration:+dur,duration_unit:'t',symbol:sym()};
  if(/OVER|UNDER|MATCH|DIFF/.test(type)) params.barrier=String(+$('barrier').value);
  openContract=true;
  send({buy:1,price:+stake,parameters:params,passthrough:{src,type,stake:+stake}});
}

function onContract(m){
  const c=m.proposal_open_contract,pt=m.echo_req.passthrough||{};
  if(!c||!c.is_sold)return;
  if(c._done)return;
  if(m.subscription) send({forget:m.subscription.id});
  openContract=false;
  const profit=Number(c.profit);
  pl+=profit;$('pl').textContent=fmt(pl);$('pl').className=pl>=0?'w':'l';
  const tr=document.createElement('tr');
  tr.innerHTML='<td>'+new Date().toLocaleTimeString()+'</td><td>'+(pt.src||'')+'</td><td>'+(c.contract_type||pt.type)+'</td><td>'+fmt(pt.stake||c.buy_price)+'</td><td class="'+(profit>=0?'w':'l')+'">'+(profit>=0?'+':'')+fmt(profit)+'</td>';
  $('log').prepend(tr);
  if(pt.src==='bot') afterBotTrade(profit);
}

$('buyA').onclick=()=>buy(labels()[0],$('stake').value,$('dur').value,'manual');
$('buyB').onclick=()=>buy(labels()[1],$('stake').value,$('dur').value,'manual');

/* ---------- bot ---------- */
function botDecide(){
  const n=+$('n').value,s=$('strat').value;
  let type=null;
  if(s==='streak'){
    const d=digits.slice(-n);
    if(d.length<n)return;
    if(d.every(x=>x%2===1)) type='DIGITEVEN';
    else if(d.every(x=>x%2===0)) type='DIGITODD';
  }else{
    const t=ticks.slice(-(n+1));
    if(t.length<n+1)return;
    const up=t.every((p,i)=>i===0||p>t[i-1]),dn=t.every((p,i)=>i===0||p<t[i-1]);
    if(up) type=s==='momentum'?'CALL':'PUT';
    else if(dn) type=s==='momentum'?'PUT':'CALL';
  }
  if(!type)return;
  trades++;
  buy(type,curStake,$('bdur').value,'bot');
  $('botmsg').textContent='Trade '+trades+': '+type+' @ '+fmt(curStake);
}
function afterBotTrade(profit){
  const base=+$('bstake').value,m=+$('mart').value,mx=+$('maxs').value;
  curStake=profit<0?Math.min(curStake*m,mx):base;
  if(pl>=+$('tp').value) return stopBot('Take profit reached');
  if(pl<=-Math.abs(+$('sl').value)) return stopBot('Stop loss reached');
  if(trades>=+$('mt').value) return stopBot('Max trades reached');
}
function startBot(){
  curStake=+$('bstake').value;trades=0;botOn=true;
  $('start').disabled=true;$('stop').disabled=false;$('botmsg').textContent='Bot running, waiting for a signal';
}
function stopBot(msg){
  botOn=false;$('start').disabled=!authed;$('stop').disabled=true;
  if(msg)$('botmsg').textContent='Bot stopped: '+msg;
}
$('start').onclick=startBot;
$('stop').onclick=()=>stopBot('stopped by you');

$('sym').onchange=()=>{if(authed)subscribeTicks();};
$('connect').onclick=connect;
$('disc').onclick=()=>{if(ws)ws.close();};
setConnected(false);
})();
</script>
</body>
  </html>
